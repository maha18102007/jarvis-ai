<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS AI</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#050b14;color:#eaf6ff;
font-family:Arial,sans-serif;text-align:center;
padding:30px 18px
}
h1{color:#55dfff;letter-spacing:7px}
.orb{
width:165px;height:165px;border-radius:50%;
margin:40px auto;
background:radial-gradient(circle,#72eaff,#12658e 45%,#07182d 75%);
box-shadow:0 0 45px #19bfffff;
animation:pulse 3s infinite
}
@keyframes pulse{
50%{box-shadow:0 0 75px #19bfffff}
}
#status{color:#72dfff;margin:20px}
input{
width:75%;padding:15px;border-radius:25px;
border:1px solid #258bb5;background:#101e30;
color:white;font-size:16px
}
button{
padding:14px 20px;margin:8px;
border:0;border-radius:25px;
background:#087fae;color:white;font-size:16px
}
#reply{margin:25px auto;max-width:500px;line-height:1.6}
</style>
</head>
<body>

<h1>J.A.R.V.I.S</h1>
<p>PERSONAL AI ASSISTANT</p>

<div class="orb"></div>

<div id="status">SYSTEM ONLINE</div>

<input id="command" placeholder="Ask me anything...">

<br>

<button onclick="ask()">SEND</button>
<button onclick="listen()">🎙 SPEAK</button>

<div id="reply">Good evening. I am JARVIS. How may I assist you?</div>

<script>
function speak(text){
let speech=new SpeechSynthesisUtterance(text);
speechSynthesis.speak(speech);
}

function ask(){
let input=document.getElementById("command");
let question=input.value.toLowerCase();
let answer="I'm still learning. This feature will be upgraded soon.";

if(question.includes("hello"))
answer="Hello! How can I help you today?";

else if(question.includes("your name"))
answer="I am JARVIS, your personal AI assistant.";

else if(question.includes("time"))
answer="The time is "+new Date().toLocaleTimeString();

else if(question.includes("date"))
answer="Today's date is "+new Date().toDateString();

else if(question.includes("who are you"))
answer="I am JARVIS, created to assist you.";

document.getElementById("reply").innerText=answer;
speak(answer);
input.value="";
}

function listen(){
let Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;

if(!Recognition){
document.getElementById("status").innerText=
"Voice recognition is not supported in this browser.";
return;
}

let recognition=new Recognition();
recognition.lang="en-IN";
recognition.onstart=()=>{
document.getElementById("status").innerText="LISTENING...";
};
recognition.onresult=(event)=>{
document.getElementById("command").value=
event.results[0][0].transcript;
ask();
};
recognition.onerror=()=>{
document.getElementById("status").innerText="VOICE ERROR";
};
recognition.onend=()=>{
document.getElementById("status").innerText="SYSTEM ONLINE";
};
recognition.start();
}
</script>

</body>
</html>
